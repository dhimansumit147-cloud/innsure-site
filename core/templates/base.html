{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innsure Health Services</title>


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f6f8;
            --card: rgba(255,255,255,0.65);
            --text: #111;
            --primary: #111;
            --border: rgba(0,0,0,0.1);
        }

        body.dark {
            --bg: #0f0f0f;
            --card: rgba(30,30,30,0.6);
            --text: #fff;
            --primary: #fff;
            --border: rgba(255,255,255,0.1);
        }

        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition:0.3s;
        }

        /* ================= HEADER ================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
        }

        /* ================= LOGO SECTION (UPDATED) ================= */
        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-box {
            background: white;
            border-radius: 14px;
        }

        .logo-box img {
            height: 120px;   
            width: auto;
        }

        .brand-text h1 {
            font-size: 38px;  /* 🔥 BIG INNSURE */
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-text p {
            font-size: 30px;  /* 🔥 HEALTH SERVICES BIG */
            font-weight: 600;
            letter-spacing: 3px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* ================= NAV ================= */
        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            font-weight: 500;
            position: relative;
        }

        nav a.active {
            color: #fff;
        }

        nav a.active::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 100%;
            height: 2px;
            background: white;
        }

        /* ================= MAIN ================= */
        main {
            min-height: 80vh;
            padding: 20px;
        }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: #aaa;
        }

        /* ================= WHATSAPP ================= */
        .whatsapp {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #25D366;
            color: white;
            padding: 12px 15px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
        }

        /* ================= MOBILE BOTTOM NAV ================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: space-around;
            padding: 10px 0;
        }

        .bottom-nav a {
            color: #aaa;
            text-decoration: none;
        }

        .bottom-nav a.active {
            color: #fff;
        }

        /* ================= RESPONSIVE ================= */
        @media(max-width:1024px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
                padding: 20px;
            }

            nav {
                display: none;
            }

            .bottom-nav {
                display: flex;
            }

            .logo-box img {
                height: 60px;
            }

            .brand-text h1 {
                font-size: 38px;
            }

            .brand-text p {
                font-size: 12px;
            }
        }

        @media(max-width:768px) {

            .logo-box img {
                height: 50px;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .brand-text p {
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header>

    <div class="logo">

        <div class="logo-box">
            <img src="{% static 'img/logo.png' %}" alt="Logo">
        </div>

        <div class="brand-text">
            <h1>INNSURE HEALTH SERVICES </h1>
            <p>& COMPANY</p>
           
        </div>

    </div>

    <nav>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="/about/" class="{% if 'about' in request.path %}active{% endif %}">About</a>
        <a href="/services/" class="{% if 'services' in request.path %}active{% endif %}">Services</a>
        <a href="/hospital/" class="{% if 'hospital' in request.path %}active{% endif %}">Hospitals</a>
        <a href="/contact/" class="{% if 'contact' in request.path %}active{% endif %}">Contact</a>
    </nav>

</header>

<!-- ================= MAIN ================= -->
<main>
    {% block content %}
    {% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer>
    © <span id="year"></span> Innsure Health Services
</footer>

<!-- ================= MOBILE NAV ================= -->
<div class="bottom-nav">
    <a href="/" class="{% if request.path == '/' %}active{% endif %}">🏠</a>
    <a href="/about/" class="{% if 'about' in request.path %}active{% endif %}">ℹ️</a>
    <a href="/hospital/" class="{% if 'hospital' in request.path %}active{% endif %}">🏥</a>
    <a href="/services/" class="{% if 'services' in request.path %}active{% endif %}">⚕️</a>
    <a href="/contact/" class="{% if 'contact' in request.path %}active{% endif %}">📞</a>
</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
