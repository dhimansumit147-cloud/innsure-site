{% extends 'sidebar.html' %}

{% block content %}

<style>

/* ================= PAGE WRAPPER ================= */
.page-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px;
}

/* ================= CARD ================= */
.card {
    width: 100%;
    max-width: 520px;

    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);

    padding: 30px;
    border-radius: 18px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.08);

    animation: fadeUp 0.5s ease;
}

/* TITLE */
.card h2 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 20px;
    color: #111827;
}

/* FORM GROUP */
.form-group {
    margin-bottom: 15px;
}

/* LABEL */
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #6b7280;
}

/* INPUT */
.form-group input {
    width: 100%;
    padding: 12px 14px;

    border: 1px solid #e5e7eb;
    border-radius: 12px;

    outline: none;
    font-size: 14px;

    transition: 0.3s;
    background: #f9fafb;
}

.form-group input:focus {
    border-color: #10b981;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.12);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(135deg,#10b981,#059669);
    color: #fff;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(16,185,129,0.3);
}

/* INFO BOX */
.info {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .card {
        padding: 20px;
    }
}

</style>

<div class="page-wrap">

    <div class="card">

        <h2>🔐 Change Password</h2>

        <div class="info">
            Make sure your new password is strong and not used anywhere else.
        </div>

        <form method="POST">
            {% csrf_token %}

            <!-- OLD PASSWORD -->
            <div class="form-group">
                <label>Old Password</label>
                <input type="password" name="old_password" placeholder="Enter old password">
            </div>

            <!-- NEW PASSWORD -->
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" placeholder="Enter new password">
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm new password">
            </div>

            <!-- BUTTON -->
            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
