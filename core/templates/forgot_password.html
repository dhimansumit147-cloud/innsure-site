{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Innsure Health Services</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #eef2ff, #f5f6f8);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background: #fff;
        width: 100%;
        max-width: 430px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
        animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .logo img {
        max-width: 140px;
        margin-bottom: 15px;
    }

    h2 {
        font-size: 22px;
        margin-bottom: 5px;
        color: #111827;
    }

    p {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 25px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 16px;
    }

    label {
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        display: block;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px 40px 12px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #f9fafb;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #4e73df;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(78,115,223,0.1);
    }

    /* PASSWORD WRAPPER */
    .password-wrapper {
        position: relative;
    }

    .toggle-icon {
        position: absolute;
        right: 12px;
        top: 38px;
        cursor: pointer;
        font-size: 18px;
        color: #4e73df;
        user-select: none;
    }

    /* BUTTON */
    .btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #4e73df, #3e63c8);
        border: none;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(78,115,223,0.3);
    }

    .msg {
        font-size: 13px;
        margin-bottom: 10px;
        color: #16a34a;
    }

    .error {
        color: #dc2626;
    }

    .back {
        margin-top: 15px;
        font-size: 13px;
    }

    .back a {
        color: #4e73df;
        text-decoration: none;
        font-weight: 500;
    }

    .back a:hover {
        text-decoration: underline;
    }

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="{% static 'img/logo.png' %}" alt="Logo">
    </div>

    <h2>Reset Password</h2>
    <p>Enter your username and set new password</p>

    {% for message in messages %}
        <div class="msg {% if message.tags == 'error' %}error{% endif %}">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter username">
        </div>

        <!-- NEW PASSWORD -->
        <div class="form-group password-wrapper">
            <label>New Password</label>
            <input type="password" id="new_password" name="new_password" required placeholder="Enter new password">
            <span class="toggle-icon" onclick="togglePassword('new_password', this)">👁️</span>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group password-wrapper">
            <label>Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm password">
            <span class="toggle-icon" onclick="togglePassword('confirm_password', this)">👁️</span>
        </div>

        <button class="btn" type="submit">Update Password</button>
    </form>

    <div class="back">
        <a href="{% url 'login' %}">← Back to Login</a>
    </div>

</div>

<script>
    function togglePassword(fieldId, icon) {
        const input = document.getElementById(fieldId);

        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "🙈";
        } else {
            input.type = "password";
            icon.textContent = "👁️";
        }
    }
</script>

</body>
</html>
