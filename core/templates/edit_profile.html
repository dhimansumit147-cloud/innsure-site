{% extends 'sidebar.html' %}

{% block content %}

<style>

/* ================= PAGE WRAPPER ================= */
.page-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px;
}

/* ================= CARD ================= */
.form-container {
    width: 100%;
    max-width: 520px;

    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);

    padding: 30px;
    border-radius: 18px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.08);

    animation: fadeUp 0.5s ease;
}

/* TITLE */
.form-container h2 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 20px;
    color: #111827;
}

/* FORM GROUP */
.form-group {
    margin-bottom: 15px;
}

/* LABEL */
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #6b7280;
}

/* INPUT */
.form-group input {
    width: 100%;
    padding: 12px 14px;

    border: 1px solid #e5e7eb;
    border-radius: 12px;

    outline: none;
    font-size: 14px;

    transition: 0.3s;
    background: #f9fafb;
}

.form-group input:focus {
    border-color: #3b82f6;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(135deg,#3b82f6,#2563eb);
    color: #fff;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(59,130,246,0.3);
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .form-container {
        padding: 20px;
    }
}

</style>

<div class="page-wrap">

    <div class="form-container">

        <h2>✏️ Edit Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- USERNAME -->
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}">
            </div>

            <!-- FIRST NAME -->
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ user.first_name }}">
            </div>

            <!-- LAST NAME -->
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name }}">
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}">
            </div>

            <!-- BUTTON -->
            <button type="submit">
                Update Profile
            </button>

        </form>

    </div>

</div>

{% endblock %}
