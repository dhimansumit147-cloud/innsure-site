{% extends 'sidebar.html' %}

{% block title %}Add Hospital{% endblock %}

{% block content %}

<style>
.form-container {
    max-width: 600px;
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}

.form-container h2 {
    margin-bottom: 20px;
    font-size: 26px;
    font-weight: 700;
    color: #111827;
}

/* INPUTS */
.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #374151;
    font-weight: 500;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
    background: #f9fafb;
}

input:focus, textarea:focus, select:focus {
    border-color: #3b82f6;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg,#3b82f6,#2563eb);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59,130,246,0.3);
}
</style>

<div class="form-container">

    <h2>Add New Hospital</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Category</label>
            <select name="category" required>
                <!-- Removed the placeholder option -->
                <option value="General">General</option>
                <option value="Specialty">Specialty</option>
                <option value="Emergency">Emergency</option>
            </select>
        </div>

        <div class="form-group">
            <label>Hospital Name</label>
            <input type="text" name="name" placeholder="Enter hospital name" required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address" rows="4" placeholder="Enter address" required></textarea>
        </div>


        <button type="submit">+ Add Hospital</button>
    </form>

</div>

{% endblock %}
