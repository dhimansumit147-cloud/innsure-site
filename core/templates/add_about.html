{% extends 'sidebar.html' %}

{% block content %}

<div class="form-container">

    <h2>Add About Content</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Title</label>
        <input type="text" name="title" required>

        <label>Description</label>
        <textarea name="description" rows="6" required></textarea>

        <label>Status</label>
        <select name="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

        <button type="submit">Save</button>

    </form>

</div>

<style>

.form-container{
    max-width:600px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    font-weight:600;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    margin-top:20px;
    background:#111;
    color:#fff;
    padding:12px;
    width:100%;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#333;
}

</style>

{% endblock %}
